services:
  neo4j:
    image: neo4j:5-community
    container_name: rss-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (visual graph + Cypher console)
      - "7687:7687"   # Bolt protocol (used by the backend)
    environment:
      NEO4J_AUTH: neo4j/resource123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p resource123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  api:
    build: ./backend
    container_name: rss-api
    ports:
      - "3000:3000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: resource123
      PORT: 3000
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
